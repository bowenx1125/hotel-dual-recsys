name: research-smoke
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
      - name: Run synthetic/unit tests (no 515K download)
        run: |
          python -m unittest discover -s tests -v
      - name: Small-fixture research pipeline
        run: |
          python run_research.py --small-fixture --verify-only
      - name: Secret and raw-text leakage scan
        run: |
          python -m unittest tests.test_no_leakage -v
