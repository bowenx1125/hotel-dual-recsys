aspects:
  - location
  - cleanliness
  - breakfast
  - service
  - noise
  - room
  - value

aspect_labels:
  location: Location
  cleanliness: Cleanliness
  breakfast: Breakfast
  service: Service
  noise: Noise / quiet
  room: Room
  value: Value

min_mentions: 5
min_reviews_hotel: 10
reliability_k: 10.0
min_reliability: 0.3
min_measured_peers: 2
policy_version: shared-v1

# Peer-Relative Evidence-Weighted (heuristic) — DESCRIPTIVE design-choice weights.
# Weights are NOT learned business returns.
weights:
  gap: 0.45
  criticism: 0.35
  unreliable: 0.2

scenario:
  crowding_weight: 0.5
  default_intensity: 0.0
  intensity_min: 0.0
  intensity_max: 1.0

tie_break: aspect_name_asc
heuristic_name: Peer-Relative Evidence-Weighted (heuristic)
formula: "score = w_gap*gap_norm + w_criticism*criticism_norm - w_unreliable*(1-reliability) [design-choice weights; not learned returns]. Assumed crowding term is separate scenario analysis."
actionability_config: conf/actionability.json
